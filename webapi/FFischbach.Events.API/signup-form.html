<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event-Anmeldung</title>

    <!-- Import bootstrap minified using jsdelivr cdn -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <style>
        .prevent-select {
            -webkit-user-select: none; /* Safari */
            -ms-user-select: none; /* IE 10 and IE 11 */
            user-select: none; /* Standard syntax */
        }
    </style>
</head>

<body class="p-3">

    <!-- Displayed when sign up was successful. -->
    <div id="content_success" class="d-none">
        <div class="alert alert-success" role="alert">
            <h4 class="alert-heading">Anmeldung erfolgreich</h4>
            <p class="mb-0">Die Gruppe <strong id="content_success_groupName"></strong> wurde im System hinterlegt.</p>
        </div>
    </div>

    <!-- Displayed when sign up failed. -->
    <div id="content_error" class="d-none">
        <div class="alert alert-danger" role="alert">
            <h4 class="alert-heading">Das hat nicht geklappt!</h4>
            <p><strong id="txt_error">Es ist ein unerwarteter Fehler aufgetreten</strong></p>
            <button id="btnErrorRepeat"
                    type="button"
                    class="btn btn-dark"
                    onclick="returnToForm(event)">
                <i class="bi bi-arrow-left pe-2"></i>
                Zurück zum Formular
            </button>
        </div>
    </div>

    <!-- Displayed during sign up. -->
    <div id="content_form" class="d-block">

        <form onsubmit="submitForm(event)" class="needs-validation" novalidate>
            <!-- Centered header -->
            <div class="text-center">
                <h2>
                    <!-- %DESCRIPTIONFLAG% This is a flag for the api to insert the event description here. -->
                </h2>
                <p class="lead">Anmeldeformular</p>
            </div>

            <!-- Group information -->
            <div class="pb-3">
                <h4 class="mb-3">Gruppe</h4>

                <!-- Group name-->
                <div class="mb-3">
                    <label for="groupName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="groupName" aria-describedby="groupNameHelp" required>
                    <div id="groupNameHelp" class="form-text">Verwende Deinen Vor- und Nachnamen, wenn Du Dich als Einzelperson anmeldest</div>
                </div>

                <!-- Group category -->
                <div class="mb-3">
                    <label for="category" class="form-label">Kategorie</label>
                    <select id="category" class="form-select" aria-label="Auswahl der Gruppenkategorie" required>
                        <!-- %OPTIONFLAG%: This is a flag for the api to insert the category options here. -->
                    </select>
                </div>
            </div>

            <!-- Contact information -->
            <div class="pb-3">
                <h4 class="mb-3">Ansprechpartner</h4>

                <!-- Contact name -->
                <div class="row g-3 mb-3">
                    <!-- First name -->
                    <div class="col">
                        <label for="contactFirstName" class="form-label">Vorname</label>
                        <input type="text" class="form-control" id="contactFirstName" required>
                    </div>

                    <!-- Last name -->
                    <div class="col">
                        <label for="contactLastName" class="form-label">Nachname</label>
                        <input type="text" class="form-control" id="contactLastName" required>
                    </div>
                </div>

                <!-- Contact birth date -->
                <div class="mb-3">
                    <label for="contactBirthDate" class="form-label">Geburtsdatum</label>
                    <input type="date" class="form-control" id="contactBirthDate" required>
                </div>

                <!-- Contact email -->
                <div class="mb-3">
                    <label for="contactEmail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="contactEmail" aria-describedby="contactEmailHelp" required>
                    <div id="contactEmailHelp" class="form-text">Für mögliche Rückfragen</div>
                </div>
            </div>

            <!-- Further participants -->
            <div class="pb-3">
                <h4 class="mb-3">Weitere Teilnehmer</h4>

                <!-- Participant inputs-->
                <div id="participants" class="mb-3"></div>

                <!-- Add participants button -->
                <button type="button" class="btn btn-light" onclick="addParticipant()"><i class="bi bi-person-plus-fill pe-2"></i>Teilnehmer hinzufügen</button>
            </div>

            <!-- Terms and conditions -->
            <div class="mb-3">
                <!-- AGB Textarea -->
                <label for="termsAndConditions" class="form-label">Allgemeine Geschäftsbedingungen</label>
                <textarea class="form-control form-control-sm mb-2" id="termsAndConditions" rows="6" readonly>
- Die Anmeldung führt nicht automatisch zum Erhalt von Karten. Dies erfolgt nur nach Kapazität und Prüfung der angegebenen Daten.
- Falsche Angaben führen automatisch zu einer Ablehnung der Eintrittskarten.
- Einlass wird nur mit einer personalisierten Eintrittskarte gewährt.
- Bei Einlass ist ggf. ein Ausweisdokument vorzulegen.
- Die Eintrittskarte berechtigt nicht verbindlich, bzw. nicht zum sofortigen Einlass in den Veranstaltungsraum.
- Am Eingang kann es, je nach Auslastung im Veranstaltungsraum, zu Wartezeiten kommen.
- Stark alkoholisierten Personen wird kein Einlass gewährt.
- Mitgebrachte Getränke müssen am Eingang abgegeben werden.
- Verkauf von Getränken und Speisen nur gegen Wertmarken.
- Wir halten uns an das Gesetz zum Schutz der Jugend in der Öffentlichkeit.
- Wir übernehmen keine Haftung für Garderobe, Sachschäden oder Körperschäden.</textarea>

                <!-- AGB checkbox-->
                <input class="form-check-input" type="checkbox" id="termsAndConditionsCheck" required>
                <label class="form-check-label prevent-select" for="termsAndConditionsCheck">Ich habe die AGB gelesen und bin damit einverstanden</label>
            </div>

            <!-- Privacy policy -->
            <div class="mb-3">
                <input class="form-check-input" type="checkbox" id="privacyPolicyCheck" required>
                <label class="form-check-label prevent-select" for="privacyPolicyCheck">Ich stimme der Verarbeitung meiner Daten im Rahmen der <a href="https://www.feuerwehr-fischbach.de/datenschutzerkl%C3%A4rung/" target="_blank">Datenschutzvereinbarung</a> zu</label>
            </div>

            <button id="btnSubmit" type="submit" class="btn btn-primary"><span id="submitSpinner" class="d-none spinner-border spinner-border-sm pe-2" role="status" aria-hidden="true"></span><i id="submitIcon" class="bi bi-send-fill pe-2"></i>Absenden</button>
        </form>

    </div>

    <script>
        "use strict";

        const EVENT_ID = ""; // %EVENTIDFLAG%: This is a flag for the api to insert the correct event id.

        // Data to be sent to the api
        let data = {
            name: undefined,
            eventId: EVENT_ID,
            contact: {
                email: undefined,
                firstName: undefined,
                lastName: undefined,
                birthDate: undefined,
            },
            categoryId: document.getElementById("category").value,
            participants: [],
        };

        // Bootstrap functionality used to prevent browser validation and use the custom one
        (() => {
            // Fetch all the forms we want to apply custom Bootstrap validation styles to
            const forms = document.querySelectorAll(".needs-validation");

            // Loop over them and prevent submission
            Array.from(forms).forEach(form => {
                form.addEventListener("submit", e => {
                    if (!form.checkValidity()) {
                        e.preventDefault();
                        e.stopPropagation();
                    }

                    form.classList.add('was-validated')
                }, false);
            })
        })();

        // Listen to input changes
        (() => {
            document.getElementById("groupName").addEventListener("change", (e) => data.name = e.target.value);
            document.getElementById("category").addEventListener("change", (e) => data.categoryId = e.target.value);
            document.getElementById("contactFirstName").addEventListener("change", (e) => data.contact.firstName = e.target.value);
            document.getElementById("contactLastName").addEventListener("change", (e) => data.contact.lastName = e.target.value);
            document.getElementById("contactBirthDate").addEventListener("change", (e) => data.contact.birthDate = e.target.value);
            document.getElementById("contactEmail").addEventListener("change", (e) => data.contact.email = e.target.value);
        })();

        // Dynamic Participant behavior
        const addParticipant = () => {
            const participantsContainer = document.getElementById("participants");

            // Create a grid div to put the elements into.
            const container = document.createElement("div");
            container.className = "row g-2 mb-3";

            // First name
            const firstNameContainer = document.createElement("div");
            firstNameContainer.className = "col-12 col-sm";
            const firstNameInput = document.createElement("input");
            firstNameInput.className = "form-control";
            firstNameInput.placeholder = "Vorname";
            firstNameInput.setAttribute("type", "text");
            firstNameInput.setAttribute("required", "");
            firstNameInput.addEventListener("change", (e) => participantData.firstName = e.target.value);
            firstNameContainer.appendChild(firstNameInput);
            container.appendChild(firstNameContainer);

            // Last name
            const lastNameContainer = document.createElement("div");
            lastNameContainer.className = "col-12 col-sm";
            const lastNameInput = document.createElement("input");
            lastNameInput.className = "form-control";
            lastNameInput.placeholder = "Nachname";
            lastNameInput.setAttribute("type", "text");
            lastNameInput.setAttribute("required", "");
            lastNameInput.addEventListener("change", (e) => participantData.lastName = e.target.value);
            lastNameContainer.appendChild(lastNameInput);
            container.appendChild(lastNameContainer);

            // First name
            const birthDateContainer = document.createElement("div");
            birthDateContainer.className = "col-12 col-sm";
            const birthDateInput = document.createElement("input");
            birthDateInput.className = "form-control";
            birthDateInput.setAttribute("type", "date");
            birthDateInput.setAttribute("required", "");
            birthDateInput.addEventListener("change", (e) => participantData.birthDate = formatDate(e.target.value));
            birthDateContainer.appendChild(birthDateInput);
            container.appendChild(birthDateContainer);

            // Remove button
            const removeBtnContainer = document.createElement("div");
            removeBtnContainer.className = "col-auto";
            const removeBtn = document.createElement("button");
            removeBtn.className = "btn btn-danger"
            removeBtn.setAttribute("type", "button");
            removeBtn.addEventListener("click", (e) => {
                data.participants = data.participants.filter((e) => e !== participantData);
                participantsContainer.removeChild(container);
            });
            const removeBtnIcon = document.createElement("i");
            removeBtnIcon.className = "bi bi-person-dash-fill";
            removeBtn.appendChild(removeBtnIcon);
            removeBtnContainer.appendChild(removeBtn);
            container.appendChild(removeBtnContainer);

            // Data
            const participantData = {
                firstName: "",
                lastName: "",
                birthDate: "",
            };
            data.participants.push(participantData);

            participantsContainer.appendChild(container);
        };

        // Format date to the apis needs
        const formatDate = (string) => {
            return new Date(string).toISOString().split("T")[0];
        };

        // Send the collected data to the api
        const submitForm = (e) => {
            // Prevent form post
            e.preventDefault();

            // Set button to loading state.
            document.getElementById("btnSubmit").setAttribute("disabled", "");
            document.getElementById("submitIcon").classList.add("d-none");
            document.getElementById("submitSpinner").classList.remove("d-none");

            // Validate inputs
            if (e.target.checkValidity()) {

                // Send the inputs to the api
                fetch("https://ffischbach-events-api.palzone.de/Groups", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify(data),
                }).then((e) => {
                    // Received an answer from the api
                    const error_text = document.getElementById("txt_error");
                    const content_success = document.getElementById("content_success");
                    const content_error = document.getElementById("content_error");
                    const content_form = document.getElementById("content_form");

                    // Check status
                    if (e.ok) {
                        // Success

                        content_form.className = "d-none";
                        content_success.className = "d-flex flex-column";
                        document.getElementById("content_success_groupName").innerText = data.name;
                    }
                    else {
                        // Failure

                        // Get the body to extract the error message.
                        e.json().then((x) => {
                            // Check if a title can be found and the status code indicates an error that can be shown to the user.
                            if (x.title && e.status == 400) {
                                // Translate validation errors.
                                if (x.title == "One or more validation errors occurred.") {
                                    x.title = "Bei der Validierung der Daten ist ein unerwarteter Fehler aufgetreten.";
                                }

                                // Show that error.
                                error_text.innerText = x.title;
                            } else {
                                // Show a generalized error.
                                error_text.innerText = "Ein unerwarteter Fehler ist aufgetreten";
                            }

                            content_form.className = "d-none";
                            content_error.className = "d-flex flex-column";
                        });
                    }
                });
            }

            // Set button back to normal state.
            document.getElementById("submitSpinner").classList.add("d-none");
            document.getElementById("submitIcon").classList.remove("d-none");
            document.getElementById("btnSubmit").removeAttribute("disabled");
        };

        const returnToForm = (event) => {
            const content_error = document.getElementById("content_error");
            const content_form = document.getElementById("content_form");
            content_error.className = "d-none";
            content_form.className = "d-block";
        };
    </script>
</body>
</html>
